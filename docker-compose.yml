version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vayudrishti-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: Vayu_Drishti
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev_password_replace_in_env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Vayu_Drishti"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
